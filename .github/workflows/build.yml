name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VivitarCapture
          path: build/Release/VivitarCapture.exe

      - name: Publish "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/Release/VivitarCapture.exe \
            --title "Latest build" \
            --notes "Automatic build of ${GITHUB_SHA::7}. Download VivitarCapture.exe below and run it." \
            --target "$GITHUB_SHA"
