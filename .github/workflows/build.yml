name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile shaders (validation)
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter fxc.exe |
                 Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw "fxc.exe not found" }
          $src = Get-Content src/renderer.cpp -Raw
          $m = [regex]::Match($src, 'R"HLSL\((.*?)\)HLSL"', 'Singleline')
          Set-Content -Path shaders.hlsl -Value $m.Groups[1].Value
          $entries = @(@('VSMain','vs_5_0'),@('PSConvert','ps_5_0'),@('PSMain','ps_5_0'),@('PSToY','ps_5_0'),@('PSToUV','ps_5_0'),
                       @('PSDown','ps_5_0'),@('PSMotion','ps_5_0'),@('PSTemporal','ps_5_0'),@('PSCopy','ps_5_0'))
          $failed = $false
          foreach ($e in $entries) {
            & $fxc.FullName /nologo /O3 /E $e[0] /T $e[1] /Fo NUL shaders.hlsl
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::Shader $($e[0]) failed to compile"; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VivitarCapture
          path: build/Release/VivitarCapture.exe

      - name: Publish "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/Release/VivitarCapture.exe \
            --title "Latest build" \
            --notes "Automatic build of ${GITHUB_SHA::7}. Download VivitarCapture.exe below and run it." \
            --target "$GITHUB_SHA"
